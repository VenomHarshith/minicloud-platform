limit_req_zone $http_cf_connecting_ip zone=public_snapshot:10m rate=2r/s;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 1k;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; object-src 'none'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /api/v1/snapshot {
    limit_req zone=public_snapshot burst=12 nodelay;
    limit_except GET { deny all; }
    proxy_pass http://public-api:8081/api/v1/snapshot;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location ^~ /api/ {
    return 404;
  }

  location / {
    limit_except GET { deny all; }
    try_files $uri $uri/ /index.html;
  }
}
